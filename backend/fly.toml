# fly.toml app configuration file generated for procurement-backend on 2026-02-16T10:03:04+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'procurement-backend'
primary_region = 'iad'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  dockerfile = 'Dockerfile'

[env]
  ACCESS_TOKEN_EXPIRE_MINUTES = '30'
  ALGORITHM = 'HS256'
  APP_ENV = 'production'
  DEBUG = 'false'
  HOST = '0.0.0.0'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '40s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
