# ================================
# Docker Compose - Local Development
# ================================

services:
  # Backend Service - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurement-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override any env vars from .env file if needed
      - FRONTEND_URL=http://localhost:3000
    
    volumes:
      # Mount code for hot-reload during development
      - ./backend:/app
      - /app/__pycache__
      - /app/venv
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    networks:
      - procurement-network

  # Frontend Service - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: procurement-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    
    depends_on:
      - backend
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    networks:
      - procurement-network

networks:
  procurement-network:
    driver: bridge

# To use this file:
# 1. Copy .env.example to .env and fill in your values
# 2. Run: docker-compose up -d
# 3. View logs: docker-compose logs -f
# 4. Stop: docker-compose down
